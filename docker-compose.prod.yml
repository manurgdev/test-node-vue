version: '3.8'

services:
  # MongoDB service
  mongo:
    image: mongo:latest
    container_name: node-vue-mongodb-prod
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=tramitech
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  # Backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: node-vue-backend-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_DOCKER_URI=mongodb://admin:password@mongo:27017/tramitech?authSource=admin
    ports:
      - "3000:3000"
    depends_on:
      - mongo

  # Frontend service - using nginx for production
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: node-vue-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data: 