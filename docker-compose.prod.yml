version: '3.8'

services:
  # MongoDB service
  mongodb:
    image: mongo:latest
    container_name: node-vue-mongodb-prod
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb-data:/data/db

  # Backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: node-vue-backend-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/app?authSource=admin
    ports:
      - "3000:3000"
    depends_on:
      - mongodb

  # Frontend service - using nginx for production
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: node-vue-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb-data: 